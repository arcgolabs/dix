name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "advanced/v*"
      - "metrics/v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Test root module
        run: go test ./...

      - name: Test advanced module
        run: go test ./advanced/...

      - name: Test metrics module
        run: go test ./metrics/...

      - name: Test examples module
        run: go test ./examples/...

      - name: Lint root module
        run: golangci-lint run ./...

      - name: Lint advanced module
        run: golangci-lint run ./advanced/...

      - name: Lint metrics module
        run: golangci-lint run ./metrics/...

      - name: Lint examples module
        run: golangci-lint run ./examples/...

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes --verify-tag
          fi
